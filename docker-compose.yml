services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: reviva
      POSTGRES_PASSWORD: reviva
      POSTGRES_DB: reviva
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U reviva"]
      interval: 5s
      timeout: 5s
      retries: 12

  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 12

  ollama:
    image: ollama/ollama:latest
    volumes:
      - ollama:/root/.ollama
    # Do not publish 11434 — host often already has another Ollama. Diagnosis uses http://ollama:11434 on the compose network.

  ingest-service:
    build:
      context: .
      dockerfile: services/_base/Dockerfile
      args:
        SERVICE_DIR: ingest-service
    env_file: .env
    environment:
      PIPELINE_ENABLED: "true"
      DIAGNOSIS_URL: http://diagnosis-service:8000
      POLICY_URL: http://policy-service:8000
      EXECUTOR_URL: http://executor-service:8000
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  simulator-service:
    build:
      context: .
      dockerfile: services/_base/Dockerfile
      args:
        SERVICE_DIR: simulator-service
    env_file: .env
    environment:
      INGEST_URL: http://ingest-service:8000
    depends_on:
      postgres:
        condition: service_healthy
      ingest-service:
        condition: service_started

  diagnosis-service:
    build:
      context: .
      dockerfile: services/_base/Dockerfile
      args:
        SERVICE_DIR: diagnosis-service
    env_file: .env
    depends_on:
      - ollama

  policy-service:
    build:
      context: .
      dockerfile: services/_base/Dockerfile
      args:
        SERVICE_DIR: policy-service
    env_file: .env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  executor-service:
    build:
      context: .
      dockerfile: services/_base/Dockerfile
      args:
        SERVICE_DIR: executor-service
    env_file: .env
    depends_on:
      postgres:
        condition: service_healthy

  nginx:
    image: nginx:1.27-alpine
    ports:
      - "8080:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./dashboard/dist:/usr/share/nginx/html:ro
    depends_on:
      - ingest-service
      - simulator-service
      - diagnosis-service
      - policy-service
      - executor-service

volumes:
  pgdata:
  ollama:
